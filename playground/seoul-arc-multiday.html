<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X-GIS · 수도권 생활이동 flow-map (purpose × hour)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020617;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #map {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #title {
        position: fixed;
        top: 16px;
        left: 16px;
        color: #e2e8f0;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(2, 6, 23, 0.6);
        padding: 10px 14px;
        border-radius: 8px;
        max-width: 340px;
      }
      #title b {
        color: #fb923c;
      }
      #clock {
        position: fixed;
        top: 16px;
        right: 20px;
        text-align: right;
      }
      #date-label {
        color: #e2e8f0;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      #hour-label {
        color: #fb923c;
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(8px);
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #1e293b;
      }
      #play {
        background: #fb923c;
        color: #020617;
        border: none;
        border-radius: 6px;
        width: 34px;
        height: 34px;
        font-size: 15px;
        cursor: pointer;
      }
      #scrubber {
        width: min(60vw, 520px);
        accent-color: #fb923c;
      }
      #legend {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: rgba(2, 6, 23, 0.75);
        backdrop-filter: blur(8px);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #1e293b;
        white-space: nowrap;
      }
      .filter-row {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        color: #cbd5e1;
        font-size: 12px;
        font-weight: 600;
        user-select: none;
      }
      .filter-row:hover {
        color: #e2e8f0;
      }
      .chip {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .ramp-row {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-bottom: 4px;
      }
      .ramp-label {
        font-size: 11px;
        color: #cbd5e1;
        font-weight: 600;
        padding: 0 4px;
      }
      .sw {
        width: 16px;
        height: 12px;
        display: inline-block;
      }
      .sw:first-of-type {
        border-radius: 3px 0 0 3px;
      }
      .sw:last-of-type {
        border-radius: 0 3px 3px 0;
      }
      .filter-row input[type='checkbox'] {
        accent-color: #fb923c;
        width: 14px;
        height: 14px;
        cursor: pointer;
        margin: 0;
      }
      .seg-sep {
        height: 1px;
        background: #1e293b;
        margin: 2px 0;
      }
      #seg-select {
        background: #0f172a;
        color: #cbd5e1;
        border: 1px solid #334155;
        border-radius: 4px;
        font-size: 11px;
        padding: 2px 6px;
        cursor: pointer;
        outline: none;
        width: 100%;
      }
      #seg-select:hover {
        border-color: #475569;
      }
      code {
        color: #fbbf24;
      }
      .mode-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mode-cap {
        font-size: 11px;
        color: #94a3b8;
        font-weight: 600;
        width: 28px;
        flex-shrink: 0;
      }
      .seg-toggle {
        display: flex;
        flex: 1;
        border: 1px solid #334155;
        border-radius: 5px;
        overflow: hidden;
      }
      .seg-opt {
        flex: 1;
        background: #0f172a;
        color: #94a3b8;
        border: none;
        border-left: 1px solid #334155;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        cursor: pointer;
        outline: none;
      }
      .seg-opt:first-child {
        border-left: none;
      }
      .seg-opt:hover {
        color: #e2e8f0;
      }
      .seg-opt.is-active {
        background: #fb923c;
        color: #020617;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="title">
      <b>서울 생활이동 · 숨쉬는 도시</b><br />
      20260531 · 자치구 색 = 시간대별 <b id="cap-choro">순유입</b> · 화살표 =
      <b id="cap-arrow">유출</b> 방향·양.<br />
      전체 이동의 54.7%는 구내부 이동이라 순유입엔 안 잡힘 — <b>총활동</b>으로 바꾸면 각 구 자체
      활동까지 보임.
    </div>
    <div id="clock">
      <div id="hour-label">00:00</div>
    </div>
    <div id="legend">
      <div class="mode-row">
        <span class="mode-cap">색</span>
        <div class="seg-toggle" id="choro-toggle">
          <button class="seg-opt is-active" data-mode="net">순유입</button>
          <button class="seg-opt" data-mode="activity">총활동</button>
        </div>
      </div>
      <div class="ramp-row" id="ramp-net">
        <span class="ramp-label">유출</span>
        <span class="sw" style="background: #2563eb"></span>
        <span class="sw" style="background: #60a5fa"></span>
        <span class="sw" style="background: #7dd3fc"></span>
        <span class="sw" style="background: #334155"></span>
        <span class="sw" style="background: #fdba74"></span>
        <span class="sw" style="background: #f97316"></span>
        <span class="sw" style="background: #dc2626"></span>
        <span class="ramp-label">유입</span>
      </div>
      <div class="ramp-row" id="ramp-act" style="display: none">
        <span class="ramp-label">낮음</span>
        <span class="sw" style="background: #0f172a"></span>
        <span class="sw" style="background: #4c1d95"></span>
        <span class="sw" style="background: #7c3aed"></span>
        <span class="sw" style="background: #c026d3"></span>
        <span class="sw" style="background: #f0abfc"></span>
        <span class="ramp-label">높음</span>
      </div>
      <div class="seg-sep"></div>
      <label class="filter-row">
        <span class="chip" style="background: #fef3c7"></span>
        <input type="checkbox" id="cb-field" checked />
        <span>이동 벡터장</span>
      </label>
      <div class="mode-row">
        <span class="mode-cap">방향</span>
        <div class="seg-toggle" id="arrow-toggle">
          <button class="seg-opt is-active" data-mode="outflow">유출</button>
          <button class="seg-opt" data-mode="netflux">순유입</button>
        </div>
      </div>
      <div class="seg-sep"></div>
      <select id="seg-select" title="구분 필터">
        <option value="all">전체</option>
        <option value="domestic">내국인</option>
        <option value="foreign">외국인</option>
      </select>
    </div>
    <div id="controls">
      <button id="play" title="play/pause">▶</button>
      <input id="scrubber" type="range" min="0" max="23" value="0" step="1" />
    </div>
    <script type="module" src="/src/seoul-arc-multiday.ts"></script>
  </body>
</html>

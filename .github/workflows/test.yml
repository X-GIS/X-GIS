name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      # Build first so the typescript project references (compiler →
      # runtime → playground/site) emit and tests downstream of compiler
      # can resolve the published types. Same step as deploy-pages.yml.
      - run: bun run build

      # vitest is hoisted to the workspace root (node_modules/.bin) by
      # bun install. The filesystem args correspond to the source roots
      # where tests live; vitest.config.* (if any) is respected
      # automatically.
      #
      # Split per workspace: a single combined run over all ~555 files
      # accumulates worker->main RPC state on the slower CI runner until
      # `[vitest-worker]: Timeout calling "onTaskUpdate"` fires — every test
      # passes, the worker just can't report progress back in time. Separate
      # runs each start a fresh worker pool well under that threshold
      # (compiler+blueprint ~329, runtime ~226; both verified clean even on a
      # single worker locally, where the combined ~555 reliably timed out).
      - run: ./node_modules/.bin/vitest run compiler/src blueprint/src
      - run: ./node_modules/.bin/vitest run runtime/src

  # Render-behavior gate: the unit suite above NEVER executes a shader
  # (deep-dive 2026-05-25 finding #1). This job runs the SHADER-MATH gate
  # under SwiftShader (software WebGPU) so a projection-math regression
  # fails CI, not just a human eyeball:
  #   - _shader-math-parity : executes WGSL project() in a compute pass vs
  #                           the TS mirror. Pure compute runs under
  #                           SwiftShader; its weaker transcendentals just
  #                           need the spec's software-GPU tolerance.
  #   - _wgsl-compile-gate  : createShaderModule()s every emitted shader
  #                           variant (polygon base, line/point/raster/icon/
  #                           overdraw/text) and asserts zero WGSL compile
  #                           errors. Compilation needs no raster, so it runs
  #                           under SwiftShader too — catches a variant that
  #                           emits a string the GPU compiler rejects.
  #   - _vs-clip-parity     : runs the VS clip math in a standalone COMPUTE
  #                           pass (createComputePipeline) and reads it back
  #                           (mapAsync), comparing GPU vs the CPU f32 mirror.
  #                           Pure compute (same mechanism as _shader-math-
  #                           parity), so it runs under SwiftShader. Promotes
  #                           the CPU mirror the extruded/ECEF gates (G7) rely
  #                           on from locally-validated to CI-enforced.
  #   - _dequant-parity     : same — the u16→f32 dequant kernel GPU-vs-CPU,
  #                           standalone compute pass, SwiftShader-safe.
  # NOT here, by evidence from earlier runs:
  #   - _projection-coverage : needs the full engine (render pipelines) to
  #                            initialise; SwiftShader can't, so cells time
  #                            out. Stays a local / pre-push gate.
  #   - _vs-pipeline-integrity / _globe-arena-pressure : build the full RENDER
  #                            pipelines (and arena-pressure streams tiles), the
  #                            same SwiftShader init path that times _projection-
  #                            coverage out. Candidates for CI once validated on
  #                            a software-GPU run (and _globe-arena-pressure lands
  #                            with the GPUArena OOM PR). Local / pre-push for now.
  #   - pixel survey         : SwiftShader can't raster X-GIS correctly →
  #                            false-positive diffs. Local / pre-push only.
  #
  # Blocking gate (validated green on run 26387561414): shader-math runs
  # under SwiftShader and now fails CI on gross WGSL projection drift.
  render-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      # Use the PROJECT-LOCAL playwright bin (hoisted to root node_modules
      # by bun), NOT `bunx playwright` — bunx fetches the standalone
      # `playwright` package at a DIFFERENT version, installs browsers for
      # that revision, and the test step (project @playwright/test) then
      # can't find its own revision's binary. Headless runs use
      # chrome-headless-shell, a SEPARATE binary from full chromium —
      # install both or browserType.launch fails before any test runs.
      - run: ./playground/node_modules/.bin/playwright install chromium chromium-headless-shell --with-deps
      - name: Render gates under SwiftShader
        working-directory: playground
        env:
          XGIS_SOFTWARE_GPU: '1'
          HEADED: '0'
        run: ./node_modules/.bin/playwright test _shader-math-parity.spec.ts _wgsl-compile-gate.spec.ts _vs-clip-parity.spec.ts _dequant-parity.spec.ts

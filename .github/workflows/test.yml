      # reason the old single-step ordering encoded: a flake here must not abort the
      # compile/parity/pixel gates before they have reported.
      - name: Render gates — wall-clock trio (shard 1 only)
        if: needs.changes.outputs.render == 'true' && matrix.shard == 1
        working-directory: playground
        env:
          XGIS_SOFTWARE_GPU: '1'
          HEADED: '0'
          WORKERS: '1'
        run: ./node_modules/.bin/playwright test --workers=1 _adaptive-quality-ladder-gate.spec.ts _shader-dsl-mouse-interaction.spec.ts _epsg5179-reprojection.spec.ts

      # First stability/leak gate (#1349). Census of the 47 unregistered stability/perf specs
      # under playground/e2e found 8 local (no network egress), 2 mixed, and 37 network-blocked
      # (NOAA/live-tile fetches this runner cannot reach); of the 8 local ones, this is the only
      # one that is CI-safe today — it asserts STRUCTURE (the frame-validation error set stays
      # empty across a camera-jitter loop), not a wall-clock threshold, and it runs entirely off
      # the tracked ne_110m fixtures translucent-lines.xgis already loads. The other 7 local
      # specs measure wall-clock behaviour that would flake under a shared SwiftShader runner
      # and stay local / pre-push for now. Runs on the default backend (WebGPU/SwiftShader) —
      # no ?forcegl2.
      # Shard 1 only (#1863): one test, 27 s, no reason to run it four times.
      - name: Stability gate — translucent-lines buffer-destroy (#1349)
        if: needs.changes.outputs.render == 'true' && matrix.shard == 1
        working-directory: playground
        env:
          XGIS_SOFTWARE_GPU: '1'
          HEADED: '0'
          WORKERS: '1'
        run: ./node_modules/.bin/playwright test _translucent-lines-buffer-destroy.spec.ts

  # The REQUIRED branch-protection context (#1863). `render-shard` above does the
  # work across four runners; this job is the single stable name that protection
  # evaluates, exactly as `test-result` is for the `test` matrix. Without it the
  # required context `render-gate` would never post and every PR would strand on
  # "Expected — waiting" — the #895 deadlock this file's header records.
  render-gate:
    name: render-gate
    needs: [changes, render-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `needs['render-shard']`, NOT `needs.render-shard`: a hyphen in a job id is
      # SUBTRACTION to the expression parser, so the dot spelling silently evaluates
      # to an empty string and this gate would read a passing matrix as neither
      # success nor skipped — red on every PR, for a job that passed. `test-result`
      # carries the same warning for `needs['pr-title']`; it cost a red run there.
      #
      # A matrix rolls its legs up into ONE result: success only if every leg
      # succeeded. `skipped` is a pass for the same reason it is in `test-result` —
      # a docs-only PR skips every step and the shards still succeed, so the
      # protection-safe green survives. `cancelled` stays a FAILURE, deliberately,
      # for the reason spelled out in `test-result`.
      - run: |
          r='${{ needs['render-shard'].result }}'
          case "$r" in
            success|skipped)
              echo "render-shard: $r — every shard accounted for"; exit 0 ;;
            cancelled)
              echo "::warning::render-shard was CANCELLED, not failed — most often the concurrency group superseding this run."
              echo "::error::render-gate: render-shard result is '$r'"; exit 1 ;;
            *)
              echo "::error::render-gate: render-shard result is '$r' — open the render-shard legs to see which shard is red."
              exit 1 ;;
          esac

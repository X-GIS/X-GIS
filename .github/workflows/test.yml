  # ── The required status context (#1899) ──────────────────────────────────────
  #
  # `render-gate` is one of the two contexts branch protection requires, and a
  # required context is matched BY NAME. Sharding the work renamed it to
  # `render-shard (1/4)` … `(4/4)`, four names branch protection has never heard of,
  # so `render-gate` would post nothing and every PR would sit on "Expected —
  # waiting" forever. That is not hypothetical: the note at the top of this file
  # records exactly that deadlock trapping the #781 blog PR (#895).
  #
  # So the name stays, on a job that costs seconds and does nothing but read the
  # shards' verdict — the same shape `test-result` uses for the `test` matrix. For a
  # MATRIX job, `needs.render-shard.result` is already the rollup: `success` only if
  # every leg succeeded, `failure` if any failed, `skipped` if the whole job was
  # skipped.
  #
  # `if: always()` because the shards are PR-only. On `push: main` they skip, this
  # job runs, reads `skipped`, and reports green in seconds — preserving the push
  # opt-out that bounds the post-merge guard's cost, while still posting the context.
  #
  # `cancelled` fails, for the reason spelled out at length in `test-result`: passing
  # on it would let a cancelled run turn a required context green with nothing having
  # run, and branch protection evaluates the HEAD commit's checks anyway, so a
  # superseded run's failure never blocks a real merge.
  render-gate:
    name: render-gate
    needs: [render-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          r='${{ needs.render-shard.result }}'
          case "$r" in
            success)
              echo "all render shards passed" ;;
            skipped)
              echo "render shards skipped (push event, or the \`changes\` render filter did not fire)" ;;
            cancelled)
              echo "::error::render-shard was CANCELLED. Almost always this run was SUPERSEDED by a newer push to the same branch — check whether this run's head is still the PR head before investigating; if it is not, look at the run for the head SHA instead."
              exit 1 ;;
            *)
              echo "::error::render-shard result: $r — open the failing shard's log; with fail-fast disabled the other shards ran to completion, so more than one may have something to say."
              exit 1 ;;
          esac

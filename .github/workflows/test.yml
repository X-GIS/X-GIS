          # libraries they are invisible to ldd — a missing one shows up only as a
          # changed glyph in a gate below. So record the answer HERE, where a red
          # gate is already being read, instead of making the next session download
          # a diff artifact to ask it. No pipes: `grep -q` closing the pipe early
          # would SIGPIPE fc-list into a 141.
          fams=$(fc-list : family 2>/dev/null || true)
          for f in Liberation IPAGothic WenQuanYi Loma FreeSans Unifont; do
            case "$fams" in *"$f"*) echo "font $f: present" ;; *) echo "font $f: ABSENT" ;; esac

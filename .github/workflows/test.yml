      # spec respectively, so a split would cost four setups to save seconds. They run
      # on shard 1 only — running them in every shard would quadruple their flake
      # exposure for no coverage. Kept as their own step so the `bash -e` ordering the
      # note above relies on still holds: a failure here cannot pre-empt the sharded
      # batch, which has already reported.

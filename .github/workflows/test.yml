name: test

on:
  pull_request:
    # NO paths-ignore — deliberately. It used to skip the WHOLE workflow for
    # pure-documentation changes (**/*.md, docs/**, LICENSE, .gitignore) purely
    # to save runner-minutes, and that was SAFE only while main had NO required
    # status checks (measured 2026-06-18). Branch protection now REQUIRES two
    # contexts — `test-result` and `render-gate` — so a workflow that never RAN
    # posted no check and stranded every docs-only
    # PR on "Expected — waiting" forever — exactly the deadlock the old comment
    # here predicted, and the one that trapped the #781 blog PR (#895). Removed
    # per that very prescription: each expensive job already `if`-skips itself via
    # the `changes` filter when its area is untouched, a skipped required check
    # counts as a PASS, and `test-result` aggregates the matrix under one stable
    # name. A docs-only PR now runs just the sub-5s `changes` filter, skips the
    # engine legs + typecheck (they post skipped → pass), posts render-gate green
    # (all steps `if`-skipped), and — for a site/** change — runs the light site
    # build. Cost: a few runner-seconds per docs PR; benefit: it can actually merge.
  # NOTE: no `push: main` trigger. Every change reaches main through a PR,
  # which already ran this whole workflow — re-running it on the post-merge
  # push just duplicated the full matrix for no gating benefit (the PR run is
  # what gates the merge, and deploy-pages.yml runs independently of this one).
  # `workflow_dispatch` keeps a manual on-demand run available for main if
  # ever needed. If direct pushes to main (bypassing PRs) become a thing and
  # need CI, add the `push: branches: [main]` trigger back.
  workflow_dispatch:

# Cancel a PR's older in-flight run when a new commit is pushed to the same
# ref — iterative pushes used to leave 3-5min runs burning in parallel.
# Keyed on github.ref, so each PR branch cancels only its OWN older run;
# PRs don't cancel each other. Keys on the whole workflow run, so it covers
# all 5 `test` matrix legs + render-gate as one cancellable unit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap filter job (sub-5s, no bun/build) that decides which downstream jobs
  # have anything to do, so a change that only touches one area doesn't fan out
  # the whole matrix. Three outputs:
  #   render — shader/projection gate inputs (emitted WGSL + projection math +
  #            the playground harness). Drives the render-gate skip.
  #   code   — anything the engine/compiler/runtime vitest matrix + typecheck
  #            exercise. When FALSE (e.g. a site-only PR) those jobs `if`-skip
  #            every step and still post green. Note: `site/**` is deliberately
  #            NOT in `code` — the site has no vitest here, so editing it must
  #            not spin up the 7 engine legs.
  #   site   — the marketing/docs site sources. Drives the lightweight `site`
  #            build job below. A runtime/compiler change is NOT in `site`
  #            because `code`'s `bun run build` already builds the site, so the
  #            site job only needs to fire for site-only PRs.
  # The workflow file + lockfiles are in all three so editing the gate (or deps)
  # always re-runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.filter.outputs.render }}
      code: ${{ steps.filter.outputs.code }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            render:
              - 'compiler/**'
              - 'engine/**'
              - 'map/**'
              - 'shared/**'
              # geo (@xgis/geo): projections-table.ts is imported directly by the
              # render-gate parity specs (_shader-math-parity, _wgsl-compile-gate,
              # _optimizer-gpu-parity), and its geodesy vocabulary feeds the map/data
              # render paths — a geo-only PR must fire the render-gate (#959).
              - 'geo/**'
              - 'blueprint/**'
              # shader-dsl is the SOLE shader generator; the render-gate compile
              # gates (_wgsl/_glsl-compile, _emit-obfuscate, _compute-gen, _mrt,
              # _mouse, _optimizer-gpu-parity) are the ONLY place its emitters meet
              # real Tint/ANGLE — a shader-dsl-only PR must fire them (#954).
              # …but NOT its generated CHANGELOG.md. A changelog diff cannot change an
              # emitted shader, and leaving it in here is what made render-gate — the
              # slowest leg — run for 26+ min on the regeneration PR and starve (#1842).
              # See the `code` filter below for why this is an extglob and not a `!` entry.
              - 'shader-dsl/**/!(CHANGELOG.md)'
              # Audit (#954): the render-gate ALSO uniquely exercises these two.
              # rhi-webgl2 — the four ?forcegl2=1 gates (_fills-gl2 +
              # _graphics-retained-{icon,arrow,arrow-orientation}) drive WebGl2Device
              # end-to-end (assert backend==='webgl2' + pixel readback); this is its
              # ONLY CI render coverage. data — _fills-gl2-gate renders ne_110m vector
              # tiles through map/src/render/*, which value-imports @xgis/data tile
              # selection/geometry (visibleTilesFrustum, computeSliceKey,
              # buildLineSegments). NOT rhi (interfaces-only → typecheck-covered)
              # or pipeline (imported only by seoul-* demos, never the id=minimal
              # these gates load).
              # rhi-webgpu (#1565): the old exclusion claimed "no SwiftShader spec
              # drives WebGpuDevice", which this same file falsifies below —
              # _polygon-fill-flat-pixel-gate is a WebGPU RASTER gate under
              # SwiftShader and the six chain gates run on the default backend.
              # Every default-backend boot value-imports initGPUViaProviders /
              # backendProviderChain from @xgis/rhi-webgpu (map/src/gpu-boot.ts),
              # so a WebGpuDevice-only PR used to post green with ZERO pixel gates.
              - 'rhi-webgl2/**'
              - 'rhi-webgpu/**'
              - 'data/**'
              - 'playground/**'
              - 'bun.lock'
              - 'bun.lockb'
              - 'package.json'
              - '**/package.json'
              - '.github/workflows/test.yml'
            code:
              - 'compiler/**'
              - 'engine/**'
              - 'map/**'
              - 'shared/**'
              # geo (@xgis/geo): geodesy/projection vocabulary consumed by
              # map/data/runtime; its 2 vitest suites + the render-gate parity
              # specs were CI-dark — no leg or filter fired on a geo-only PR (#959).
              - 'geo/**'
              - 'blueprint/**'
              # NOT a bare `shader-dsl/**`: that matched `shader-dsl/CHANGELOG.md`, so the
              # changelog regeneration PR — a diff of two GENERATED files — fanned out the
              # whole engine matrix plus render-gate, and every merge to main force-pushed
              # that branch and cancelled the run via `concurrency` above. At a ~22 min mean
              # inter-merge interval it never finished once: six cancellations, zero
              # successes, and the changelog could not land (#1842).
              #
              # The extglob is deliberate and a leading `!` is NOT the same thing. Measured
              # against dorny/paths-filter's own matcher, `'!shader-dsl/CHANGELOG.md'` as a
              # list entry matches nearly EVERY file in the repo — each entry is its own rule
              # and the default `predicate-quantifier` is `some`, so a negated pattern reads
              # as an inclusion of everything it does not name. `some-with-excludes`, which
              # would make it mean exclusion, needs v4.0.3; this pins @v3. `!(...)` inside a
              # pattern is an ordinary glob and needs no quantifier.
              # scripts/paths-filter-semantics.test.ts runs this block through that matcher.
              - 'shader-dsl/**/!(CHANGELOG.md)'
              # rhi*/data/pipeline were CI-dark: absent from `code`, so a change
              # there ran NO vitest leg or typecheck. The new `engine-rhi-data`
              # test leg covers their suites; list them here so a change fires it.
              - 'rhi/**'
              - 'rhi-webgl2/**'
              - 'rhi-webgpu/**'
              - 'data/**'
              - 'pipeline/**'
              - 'playground/**'
              # scripts (#1700): `scripts/**/*.test.ts` is in vitest's include and the
              # `data` leg's path args (`data/src scripts`) — but it was in NO filter, so a
              # scripts-only PR set code=false, every leg skipped its steps, and all 17
              # checks posted green in ~4s having run nothing. That made the changelog suite
              # and the doc-signature ratchet CI-dark for changes to themselves.
              - 'scripts/**'
              # ONE named site file, not `site/**` — the deliberate exclusion above still
              # holds for the site at large. scripts/doc-signature-drift.test.ts READS this
              # page and asserts every signature it transcribes still names a live export,
              # so an edit here has to run vitest or the ratchet is dark in exactly the
              # scenario it exists for: the doc rotting while CI stays green (#1700).
              - 'site/src/pages/shader-dsl/reference.astro'
              - 'bun.lock'
              - 'bun.lockb'
              - 'package.json'
              - '**/package.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'vitest.setup.ts'
              # ALL workflow files, not just this one. Measured (#1842): 5 of the 6 tracked
              # workflows matched no filter at all, so `scripts/workflow-validity.test.ts` —
              # the gate that exists because a workflow once shipped unparseable (#1693) — was
              # CI-dark for every PR editing a workflow other than this file. Four rewrites of
              # changelog.yml landed that way in one day, none of them running the gate written
              # for exactly their failure mode. Only `code` needs widening: the validity gate
              # runs in the vitest legs, and render/site keep naming test.yml alone because it
              # is the file that DEFINES those jobs.
              - '.github/workflows/**'
            site:
              - 'site/**'
              - 'bun.lock'
              - 'bun.lockb'
              - 'package.json'
              - '.github/workflows/test.yml'

  test:
    needs: changes
    # NO job-level `if:` — the matrix MUST expand even when no `code` changed, or
    # the per-leg required checks never post. A job-level skip is evaluated BEFORE
    # the matrix expands, so GitHub posts a single check under the LITERAL name
    # `test (${{ matrix.id }})` (SKIPPED) and NONE of the branch-protection-required
    # per-leg contexts (`test (map)`, `test (engine-render-a)`, …) — stranding a
    # docs-only PR on "Expected" forever (observed on blog PR #895). Instead every
    # STEP below is `if`-gated on `code` (the render-gate pattern): on a
    # code-irrelevant PR each leg spins up, skips all steps, and posts green in
    # ~seconds; on a code PR the steps run the full build + vitest exactly as before.
    runs-on: ubuntu-latest
    # PARALLELIZE the unit suite. The 5 vitest path-filter sets used to run
    # SERIALLY on one runner (~149s of vitest on top of the ~28s build,
    # job ~189s). Each set is now its own matrix leg, so they run on 5
    # concurrent runners and the `test` job finishes ≈ its slowest leg
    # (engine-render ≈ build 28s + vitest 49s ≈ ~84s) instead of ~189s.
    # COST TRADEOFF: `bun run build` (28s) now runs once PER leg (5x) — more
    # runner-minutes, far less wall-clock. Watch the account's concurrent-job
    # cap (5 test legs + render-gate = 6 concurrent jobs).
    strategy:
      # One leg fails -> let the others finish so a red shard doesn't mask
      # which others are also red. Each leg is an independent vitest pool.
      fail-fast: false
      matrix:
        include:
          # IMPORTANT: each `args` value is one of the FIVE path-filter sets,
          # BYTE-IDENTICAL to the pre-matrix serial invocations. They were
          # split for the worker->main `onTaskUpdate` RPC-timeout, NOT for
          # parallelism, and must NOT be merged.
          #
          # A single combined run over all ~590 files accumulates worker->main
          # RPC state on the slower CI runner until `[vitest-worker]: Timeout
          # calling "onTaskUpdate"` fires — every test passes, the worker just
          # can't report progress back in time. Separate runs each start a
          # fresh worker pool well under that threshold.
          #
          # RE-TUNED 2026-06-10: the runtime shard was calibrated at ~226 files;
          # the god-file decomposition session grew it to 262 and the timeout
          # came back (run 27242663060: 2592/2592 tests PASSED, job failed on the
          # reporter RPC — twice). runtime split into two ~130-file shards.
          # `--silent` additionally drops the per-test console chatter
          # ([X-GIS]/[matrix] logs) that keeps the main thread busy while
          # workers wait on the RPC; failure output is unaffected.
          # NOTE: `--silent=true` (explicit value) — bare `--silent <path>` makes
          # vitest's CLI parser eat the path filter as the flag's value.
          # RE-TUNED 2026-06-16: the R8 bug-hunt + decomposition test files pushed
          # BOTH ~130 shards to 156 files; render+projection+text flaked the RPC
          # timeout again (PR #384 run 27581620678 — 'Timeout calling onTaskUpdate').
          # Split runtime into FOUR path-invocations, each <110 files (render 72 /
          # projection+text 84 / engine-rest 92 / non-engine 64 = 312, a clean
          # partition of runtime/src), each a fresh worker pool under the threshold.
          #
          # If a future file-growth pushes one leg back over ~110 files and the
          # timeout returns, SPLIT THAT ONE `id` into two matrix entries — do
          # NOT rebalance by merging legs back together.
          - id: compiler-blueprint
            args: compiler/src blueprint/src
          # shader-dsl unit suite (emit/intrinsics/cast gates + examples emit-gate). Pure
          # vitest, no GPU — its own leg so a GLSL-backend or example regression fails CI
          # (it was previously local-only).
          # SPLIT 2026-07-10: the #932 integer-df64 random-sweep suites run 9-18s
          # PER TEST and starve the worker->main RPC — run 29063270590: all 86
          # files / 598 tests PASSED, the job failed on 'Timeout calling
          # "onTaskUpdate"'. Here the trigger is test DURATION, not the ~110-file
          # count. Per the playbook above, SPLIT this id (do NOT merge): --shard
          # gives each half a fresh worker pool so the long df64 sweeps can't
          # starve the whole suite's reporter RPC.
          - id: shader-dsl-a
            args: shader-dsl/src shader-dsl/examples --shard=1/2
          - id: shader-dsl-b
            args: shader-dsl/src shader-dsl/examples --shard=2/2
          # @xgis/map content package. The five former `engine-*` / `map` legs
          # collapsed into these on 2026-07-27, when the test corpus that lived
          # under runtime/src/engine/** — 254 files that exercised @xgis/map and
          # @xgis/data, not @xgis/engine — moved to the packages it tests. The
          # leg IDs changed with it; branch protection requires `test-result`
          # (below), not these per-leg names, so renaming them is safe.
          #
          # map/src is 471 files, far over the ~110 onTaskUpdate RPC threshold,
          # so it runs as FIVE --shard pools of ~95. Sharding (not globbing) keeps
          # the partition deterministic, disjoint and complete. Per the playbook
          # above, when growth pushes ~95 back over ~110, bump to --shard=1/6..6/6
          # — do NOT merge legs back together.
          - id: map-a
            args: map/src --shard=1/5
          - id: map-b
            args: map/src --shard=2/5
          - id: map-c
            args: map/src --shard=3/5
          - id: map-d
            args: map/src --shard=4/5
          - id: map-e
            args: map/src --shard=5/5
          # @xgis/data (74 files after the tile-catalog / tile-selection suites
          # arrived from runtime/src/data). Its own leg — combined with the
          # backend leg below it would sit at ~148, over the threshold.
          # `scripts` rides the light data leg: the changelog-generator suite
          # (scripts/emit-changelog.test.ts) is mostly pure fixtures, and the
          # spawned probes that read THIS repo's history self-skip on the
          # depth-1 checkout (no `main~N`). The two that build a throwaway repo
          # in a tmpdir do NOT skip, on purpose — one of them pins the guard
          # that refuses to render an unbounded changelog from a shallow clone,
          # which is precisely a depth-1 checkout's shape.
          - id: data
            args: data/src scripts
          # Backend + leaf packages (@xgis/engine, @xgis/rhi-webgl2,
          # @xgis/rhi-webgpu, @xgis/pipeline, @xgis/shared, @xgis/geo). These were
          # CI-DARK before #959/#1008: sharded by directory, the matrix never
          # named them, and the `code` path-filter didn't list rhi*/data/pipeline,
          # so a change there triggered NO vitest leg at all. 70 files total —
          # under the ~110-file threshold, so they share ONE leg (rhi/src has no
          # tests). If growth pushes this over ~110, SPLIT the id per the playbook
          # above (do NOT merge legs back).
          - id: engine-rhi-shared
            args: engine/src rhi-webgl2/src rhi-webgpu/src pipeline/src shared/src geo/src
          # playground/ — CI-DARK until #1626, for the same reason the leg above
          # documents: vitest.config.ts has included playground/src + playground/dev
          # for a long time, but no matrix leg named those paths, so every test
          # there ran ONLY in a full local `vitest run`. That covered the demo
          # asset-reference gate (playground/src/example-asset-references.test.ts —
          # the always-on catch for a demo referencing a file that was never
          # committed) and the dev-tooling suites (the open-data CORS bridge, the
          # S-102/S-111 catalogue builders). A handful of files, far under the
          # ~110-file RPC threshold, so one leg. NOTE: the gate shells out to
          # `git ls-files`, so this leg needs the repo checkout it already gets.
          - id: playground
            args: playground/src playground/dev
    # Distinct per-leg check name in the GitHub UI / status API, e.g.
    # "test (engine-render-a)". The single stable context for branch protection
    # is `test-result` below — require THAT, not these per-leg names.
    name: test (${{ matrix.id }})
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache bun's global package store so `bun install` reuses downloaded
      # tarballs instead of re-fetching every run. Keyed on the lockfile.
      # All 5 matrix legs share this SAME restore key, so install stays ~1s.
      #
      # RESTORE-ONLY. Exactly ONE job in this file may SAVE this key — `lint`,
      # below — and every other site uses `actions/cache/restore`. The five sites
      # share one key, so when they all miss they all try to reserve it and 14 of
      # the 15 jobs lose: `Failed to save: Unable to reserve cache with key
      # bun-Linux-…, another job may be creating this cache.` (#1857)
      #
      # The `ci-cache` workflow keeps this key warm on main — the only scope a
      # fresh PR branch can read (see that file for why nothing else writes one)
      # — and a warm EXACT hit makes `actions/cache` skip the save outright, so
      # for most PRs there is nothing to race over. But the key is the LOCKFILE
      # HASH, so that only covers PRs whose lockfile equals main's. A PR that
      # EDITS bun.lock computes a key no warm can precede: measured on run
      # 32222092537, `hashFiles` (= sha256(sha256(bun.lock))) gave f4fcbf01d7eb…
      # for the branch against e5f652a78e… on main, and all 15 raced. Naming one
      # owner is what closes that case; the warm alone cannot.
      #
      # `restore-keys` STAYS here, unlike the browser cache below: a prefix hit
      # on a package store is a stale-but-mostly-right store that still spares
      # most of the download, whereas a prefix hit on browser binaries is the
      # WRONG revision that has to be re-downloaded in full. That asymmetry is
      # also why this key cannot simply be switched to a version, the way the
      # browser key was.
      - if: needs.changes.outputs.code == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile: fail loudly if package.json and bun.lock disagree,
      # rather than silently mutating the lockfile in CI. A single committed
      # bun.lock exists to freeze against.
      - if: needs.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile

      # Build first so the typescript project references (compiler →
      # runtime → playground/site) emit and tests downstream of compiler
      # can resolve the published types. Same step as deploy-pages.yml.
      # NOTE: this now runs once PER matrix leg (5x) instead of once.
      - if: needs.changes.outputs.code == 'true'
        run: bun run build

      # The single vitest invocation for THIS shard. `args` is unquoted on
      # purpose so multi-path / --exclude tokens word-split into separate
      # argv entries; the embedded double-quotes survive into the run line
      # and bash leaves the globs unexpanded, reproducing the original argv.
      - if: needs.changes.outputs.code == 'true'
        run: ./node_modules/.bin/vitest run --silent=true ${{ matrix.args }}

  # Typecheck gate. The vitest legs above NEVER run `tsc`, and the runtime
  # `bun run build` is a vite/esbuild bundle that strips types WITHOUT checking
  # them — so 19 runtime tsc errors reached main across #428–#430 unnoticed
  # (the build still bundled, the published .d.ts + IDE just went unsound). This
  # job runs the strict no-emit pass the wave lacked. `bun run build` first so
  # the compiler project references emit the .d.ts that runtime/tsconfig.json
  # paths resolve (and `tsc --build` in the compiler build also gates compiler
  # types); then an explicit `--noEmit` over runtime (vite skips it).
  typecheck:
    name: typecheck
    needs: changes
    # Same gate as `test`: the tsc pass is irrelevant to a site-only PR.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The e2e specs are OUTSIDE the build graph (playground/e2e/tsconfig.json
      # is a standalone program), so `bun run build` never sees them — typecheck
      # them explicitly or spec-only type rot lands silently (#1683).
      - run: ./node_modules/.bin/tsc -p playground/e2e/tsconfig.json --noEmit

  # Lint + dead-code gate (#1565). Both tools were configured and neither ran in
  # CI: ESLint executed ONLY in the pre-commit hook (so `--no-verify`, or any
  # commit made outside the hook, shipped unlinted), and `knip.json` had sat at
  # the repo root since 14ebd1a4 with `knip` installed nowhere and invoked by
  # nothing — "the knip dead-code gate" that was never wired to run. The typed
  # promise rules added in the same issue are only worth having if something
  # runs them on every PR, so they land together with this job.
  # Same shape as `typecheck`: job-level `if:` on `code`, skipped == pass.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # THE SOLE SAVER of the bun key (#1857). Every other site in this file is
      # `actions/cache/restore` — see the long note in the `test` job for why one
      # owner is needed even with the `ci-cache` warm. `lint` owns it because it
      # is a single (non-matrix) job gated on `code`, and `bun.lock` is in the
      # `code` filter, so it runs for every PR that can invalidate this key.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
        # Type-aware lint builds a TS program per package; measured peak is 5.86 GB on
        # this tree, over Node's ~4 GB default old-space (the OOM that killed this job
        # on its first run). Runners have 16 GB, so 8 GB leaves real headroom. If a
        # future tree pushes past THIS ceiling, SHARD this job by package the way
        # `test` is sharded for its own resource ceiling — do not keep raising it.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      # `knip` needs nothing: measured peak 1.33 GB, well inside the default.
      - run: bun run knip

  # PR-TITLE gate (#1842). The repo squash-merges, so the subject the changelog
  # renders each entry from is composed server-side by GitHub FROM THE PR TITLE —
  # a string commitlint never sees, because the husky `commit-msg` hook only ever
  # inspects the commits that squash away. That gap is measurable: 100 of the 210
  # first-parent commits touching `shader-dsl/` do not parse as conventional
  # commits, so they render ungrouped in the changelog's `other` bucket, and one
  # of them (`fix(ci)+feat(shader-dsl): …`) carried six public exports in behind a
  # subject beginning `fix(ci)`.
  #
  # NO `changes` filter and no `bun install`: the title is a property of the PR,
  # not of the diff, so gating it on paths would let a mistyped title through on
  # exactly the PRs that touch nothing this filter names. The script imports only
  # `node:child_process` (transitively, via the generator it borrows the predicate
  # from), so a bare checkout + bun runs it in seconds.
  #
  # PR_TITLE travels as an ENVIRONMENT variable, never as an interpolated `run:`
  # line: it is attacker-controlled on a fork PR, and an interpolation would put
  # it in the shell's own text. Skipped on workflow_dispatch (no PR payload),
  # which test-result reads as a pass.
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/lint-pr-title.ts

  # Site build gate. The engine `test` matrix used to be the only thing that
  # built the site (as a side effect of `bun run build`), so gating that matrix
  # off for site-only PRs would have left the site UNvalidated on exactly the
  # PRs that change it. This dedicated job builds the site when `site` files
  # change — one runner instead of the 7 engine legs. Skipped (→ pass via
  # test-result) when no site files changed.
  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Site-scoped build, NOT the full-monorepo `bun run build`. astro.config
      # aliases @xgis/runtime|engine|map|shader-dsl to SOURCE, so their dist
      # builds are dead weight here; only the packages the site imports through
      # package `exports` (compiler, blueprint) need dist, plus their upstream
      # chain (shared, shader-dsl). Proven 2026-07-07: site builds green with
      # engine/map/playground dist deleted — 29s vs 72s for the full
      # build. If the site ever imports a NEW workspace package without a
      # source alias, add its build to this chain.
      - run: >-
          bun run --filter '@xgis/shared' build &&
          bun run --filter '@xgis/shader-dsl' build &&
          bun run --filter '@xgis/compiler' build &&
          bun run --filter '@xgis/blueprint' build &&
          bun run --filter '@xgis/site' build

  # Single stable status context that aggregates the test matrix, typecheck,
  # site, and lint. Branch protection requires `test-result` (plus
  # `render-gate`), NOT the per-leg `test (...)` names — this name is immune to
  # leg-count changes, and requiring the leg names instead left every PR
  # permanently BLOCKED once the legs were renamed (#1757).
  # `if: always()` so it runs even when a leg fails; it then fails iff any
  # upstream job failed.
  #
  # EVERY job that gates merge quality must be in `needs` below: a job absent
  # from it is required by nothing and can regress unnoticed. `lint` was in
  # exactly that state — see #1757, where an eslint.config.js change merged
  # with eslint never having run in CI.
  test-result:
    name: test-result
    needs: [test, typecheck, site, lint, pr-title]
    if: always()
    runs-on: ubuntu-latest
    # Each upstream job is either `success` (ran and passed) or `skipped` (its
    # `changes` filter didn't fire — a path-irrelevant PR). Both are a pass;
    # anything else (failure/cancelled) fails this single stable context.
    #
    # `cancelled` DELIBERATELY still fails, even though the overwhelmingly common
    # cause is benign: the `concurrency` group above cancels a PR's older in-flight
    # run the moment a new commit is pushed, and that superseded run then reports a
    # failure here against a SHA that is no longer the head. Tempting as it is to
    # pass on `cancelled`, doing so opens a real hole — cancelling the run on the
    # CURRENT head would turn this required context green with the test matrix never
    # having run, and this is the only context branch protection requires. Branch
    # protection evaluates the HEAD commit's checks, so a superseded run's failure
    # never actually blocks a merge; its only cost is the false alarm. So: keep the
    # gate strict, and spend the effort on making the false alarm self-identifying.
    steps:
      # `github.sha` is NOT the head on a pull_request event — it is the ephemeral
      # merge commit, which cannot be compared against the PR head the triage note
      # asks the reader to check. Take the real head from the PR payload, falling
      # back to github.sha for workflow_dispatch (where there is no PR payload).
      - env:
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          fail=0
          cancelled=0
          # `needs['pr-title']`, NOT `needs.pr-title`: a hyphen in a job id is
          # SUBTRACTION to the expression parser, so the dot spelling silently
          # evaluates to an empty string and this gate reads a missing result as
          # neither success nor skipped — red on every PR, for a job that passed.
          for j in "test:${{ needs.test.result }}" "typecheck:${{ needs.typecheck.result }}" "site:${{ needs.site.result }}" "lint:${{ needs.lint.result }}" "pr-title:${{ needs['pr-title'].result }}"; do
            name=${j%%:*}; r=${j#*:}
            case "$r" in
              success|skipped) ;;
              cancelled)
                echo "::warning::$name was CANCELLED, not failed."
                cancelled=1; fail=1 ;;
              *) echo "::error::$name result: $r"; fail=1 ;;
            esac
          done
          if [ "$cancelled" -ne 0 ]; then
            echo ""
            echo "── triage ─────────────────────────────────────────────────────────"
            echo "A 'cancelled' upstream almost always means THIS RUN WAS SUPERSEDED"
            echo "by a newer push to the same branch (see the 'concurrency' group at"
            echo "the top of this workflow). Before investigating, check whether this"
            echo "run's head commit is still the PR head:"
            echo ""
            echo "    this run : $RUN_HEAD_SHA"
            echo ""
            echo "If the PR head is a LATER commit, this failure is stale — look at"
            echo "the run for the head SHA instead. There is nothing to fix here."
            echo "───────────────────────────────────────────────────────────────────"
          fi
          exit "$fail"

  # Render-behavior gate: the unit suite above NEVER executes a shader
  # (deep-dive 2026-05-25 finding #1). This job runs the SHADER-MATH gate
  # under SwiftShader (software WebGPU) so a projection-math regression
  # fails CI, not just a human eyeball:
  #   - _shader-math-parity : executes WGSL project() in a compute pass vs
  #                           the TS mirror. Pure compute runs under
  #                           SwiftShader; its weaker transcendentals just
  #                           need the spec's software-GPU tolerance.
  #   - _wgsl-compile-gate  : createShaderModule()s every emitted shader
  #                           variant (polygon base, line/point/raster/icon/
  #                           overdraw/text) and asserts zero WGSL compile
  #                           errors. Compilation needs no raster, so it runs
  #                           under SwiftShader too — catches a variant that
  #                           emits a string the GPU compiler rejects.
  #   - _vs-clip-parity     : runs the VS clip math in a standalone COMPUTE
  #                           pass (createComputePipeline) and reads it back
  #                           (mapAsync), comparing GPU vs the CPU f32 mirror.
  #                           Pure compute (same mechanism as _shader-math-
  #                           parity), so it runs under SwiftShader. Promotes
  #                           the CPU mirror the extruded/ECEF gates (G7) rely
  #                           on from locally-validated to CI-enforced.
  #   - _dequant-parity     : same — the u16→f32 dequant kernel GPU-vs-CPU,
  #                           standalone compute pass, SwiftShader-safe.
  #                           RED-BASELINE RESOLVED (#448, commit 7356ca38):
  #                           _vs-clip-parity + _dequant-parity were RED on
  #                           every main run with a GPU-vs-CPU delta ~1.23e4.
  #                           Root cause was NOT SwiftShader fround drift and
  #                           NOT a mis-set threshold — it was a TEST-SIDE
  #                           stale stride: both specs packed their synthetic
  #                           vertex buffer at a hardcoded 12 u16/vertex while
  #                           the CPU mirror dequantVertexF32 strides by
  #                           POLYGON_FILL_FORMAT.stride/2, which grew 24→28 B
  #                           (12→14 u16) when a tail slot was added. The
  #                           +2-u16 misread produced a clean +1-axis SHIFT
  #                           (GPU.y==CPU.x, CPU.z==-half zero/OOB read), not
  #                           precision noise. Fix: both specs now derive the
  #                           synthetic stride from the single-source
  #                           POLYGON_FILL_FORMAT — bit-exact, worst delta 0.0
  #                           over 24000+72000 axes. Production GPU dequant and
  #                           dequantVertexF32 already agreed on stride-28; only
  #                           the synthetic gate was stale. These two are now
  #                           green-when-good and should be REQUIRED once a
  #                           ruleset is enabled (see CI-GATED summary below).
  #   - _polygon-fill-flat-parity : runs the polygon FILL flat-Mercator arm
  #                           (proj_params.x < 0.5 — the path _vs-clip-parity's
  #                           ECEF arm does NOT cover) in a compute pass and
  #                           proves the #392 tile-local-Mercator fill arm
  #                           coincides with the f64 outline, while the pre-#392
  #                           f32-degree arm provably splits. Guards the bug
  #                           that recurred #387→#389→#392. SwiftShader-safe.
  #   - _optimizer-gpu-parity : runs optimize(PROJECTION_MODULE)'s emitted WGSL in
  #                           a compute pass and diffs project() vs the OPTIMIZED
  #                           module's f64 oracle. Proves the IR optimizer
  #                           (const/copy-prop, const-fold, dead-branch, cse, licm,
  #                           dce) preserves results through emit → real-GPU exec,
  #                           not just oracle-to-oracle. Pure compute, SwiftShader-
  #                           safe (software-GPU tolerance, same as _shader-math-
  #                           parity). Gates optimize() so the emit-path activation
  #                           of the pipeline can be trusted.
  # NOT here, by evidence from earlier runs:
  #   - _projection-coverage : needs the full engine (render pipelines) to
  #                            initialise; SwiftShader can't, so cells time
  #                            out. Stays a local / pre-push gate.
  #   - _vs-pipeline-integrity / _globe-arena-pressure : build the full RENDER
  #                            pipelines (and arena-pressure streams tiles), the
  #                            same SwiftShader init path that times _projection-
  #                            coverage out. Candidates for CI once validated on
  #                            a software-GPU run (and _globe-arena-pressure lands
  #                            with the GPUArena OOM PR). Local / pre-push for now.
  #   - pixel survey         : SwiftShader can't raster X-GIS correctly →
  #                            false-positive diffs. Local / pre-push only.
  #   - _render-verify / _render-verify-oracle-b : RASTER. _render-verify
  #                            screenshots demos and counts painted pixels;
  #                            _render-verify-oracle-b pixel-diffs the GPU frame
  #                            vs a d3-geo Canvas2D reference and SELF-DECLARES
  #                            "Real GPU headed (HEADED=1; do NOT set
  #                            XGIS_SOFTWARE_GPU). ADR-0004: LOCAL, not CI."
  #                            Both need a correct raster → SwiftShader-unsafe.
  #   - _style-parity-diff   : RASTER. pixelmatch on real X-GIS vs MapLibre
  #                            canvas screenshots — SwiftShader can't raster
  #                            X-GIS, so every cell false-positives. Local only.
  #   - _label-anchor-parity : full-engine RENDER. Boots compare.html (X-GIS +
  #                            MapLibre side-by-side), fetches real tiles, places
  #                            glyphs at z14, then reads getDumpedLabels(). Its
  #                            "numeric anchor parity" signal is derived from a
  #                            FULLY RENDERED frame, so it needs the same full
  #                            render-pipeline init SwiftShader times out on
  #                            (_projection-coverage). Header: "Real chromium
  #                            WebGPU." Local / pre-push only.
  #   - _ws8-projection-field / _matrix-gate : full-engine init / opt-in matrix
  #                            (XGIS_MATRIX), both Real-GPU per their headers.
  #                            Not SwiftShader-safe; _matrix-gate is also opt-in
  #                            so a plain CI run skips it. Local only.
  #
  # ── CI-GATED vs LOCAL-ONLY render correctness (read before assuming a
  #    non-render PR has render coverage) ────────────────────────────────────
  # CI (this job, SwiftShader, render==true) GATES ONLY the 5 pure-COMPUTE /
  # shader-COMPILE oracles below — these prove the COORDINATE/PROJECTION MATH
  # and WGSL compilability, NOT the rendered pixel:
  #   _shader-math-parity, _wgsl-compile-gate, _vs-clip-parity, _dequant-parity,
  #   _polygon-fill-flat-parity.
  # Everything that needs a RASTERIZED frame — pixel surveys, X-GIS↔MapLibre
  # parity (_style-parity-diff, _label-anchor-parity), the d3-geo oracle
  # (_render-verify-oracle-b), the visual-regression matrix (_matrix-gate), and
  # full-engine init gates (_projection-coverage, _ws8-projection-field) — is
  # LOCAL / pre-push ONLY, because SwiftShader (software WebGPU) cannot raster
  # the X-GIS pipeline correctly and would false-positive. So: a green CI here
  # means the projection/clip/dequant MATH did not regress; it does NOT mean the
  # rendered output was visually verified. Visual/parity regressions are caught
  # only on a hardware-GPU (headed) run — keep the local render matrix in the
  # loop before shipping render changes.
  #
  # Blocking gate (validated green on run 26387561414): shader-math runs
  # under SwiftShader and now fails CI on gross WGSL projection drift. The
  # dequant/clip parity pair (#448) is now green-when-good and root-caused;
  # all 5 should be made REQUIRED once a branch-protection ruleset exists.
  #
  # SKIP-WHEN-IRRELEVANT: gated on the `changes` filter. When no render-
  # affecting code changed, every expensive step is `if:`-skipped but the JOB
  # still succeeds, so the `render-gate` check posts green — the protection-
  # safe pattern for a check that MIGHT become required later. The 5
  # SwiftShader specs are UNCHANGED in coverage: whenever render code changes
  # (render == 'true') all five run exactly as before. ~82s of runner work is
  # saved per docs-only PR. Wall-clock is unchanged (this job runs in parallel
  # with `test` and is not the critical path) — the win is runner-minutes.
  # SHARDED (#1863). Measured on job 95966720266 (a SUCCESSFUL run): 284 tests over
  # 146 spec files, 62 min in ONE serial playwright invocation, 68 min job wall-clock.
  # Median spec file is 14.4 s and the largest is 5.1 min (8.2%), so there is no hot
  # spec to fix — the time is a long tail, and only parallelism moves it.
  #
  # WHY NOT `WORKERS`. Raising it is the tempting one-liner and this repo already
  # reverted it: two workers contend for ONE SwiftShader rasteriser and three
  # consecutive runs went red on three DIFFERENT specs (see the WORKERS note below).
  # Sharding is parallelism across MACHINES — each shard is its own runner with its
  # own SwiftShader, still at WORKERS=1. Same speedup, none of the contention.
  #
  # 6 shards. MEASURED, not modelled: playwright shards by TEST COUNT (at n=4 each
  # shard got exactly 70), and a test runs anywhere from 2 s to 3 min, so equal counts
  # are NOT equal time — n=4 came out 24.3 / 11.1 / 19.7 / 8.5 min and the SLOWEST
  # shard sets the wall-clock. Enumerating `--list` per shard and joining it against
  # the measured per-spec times gives, against 68 min today:
  #     n=4 -> 30 min (2.2x, 121 runner-min)
  #     n=6 -> 24 min (2.8x, 146 runner-min)   <- chosen
  #     n=8 -> 20 min (3.4x, 160 runner-min)
  # The residual ~1.5x imbalance is inherent to count-based sharding. Hand-balancing
  # the list by duration would fix it and is deliberately NOT done: a hardcoded
  # grouping goes stale silently every time a spec's cost changes (CLAUDE.md §12's
  # path-keyed-gate lesson).
  #
  # The shard count lives in THREE places that must agree — `matrix.shard`, the job
  # `name`, and the `--shard=i/N` divisor. Workflow syntax cannot derive one from
  # another, so changing N means changing all three.
  #
  # NAMED `render-shard`, NOT `render-gate`: `render-gate` is a REQUIRED branch-
  # protection context, and a matrix would rename its checks to `render-gate (1)`,
  # `render-gate (2)`… so the required context never posts and every PR strands on
  # "Expected — waiting" (the #895 deadlock this file's header records). The
  # aggregator job below keeps the name; this one does the work.
  render-shard:
    needs: changes
    # NO job-level `if:` — it is evaluated BEFORE the matrix expands, so GitHub
    # would post one check under the LITERAL name `render-shard (${{ matrix.shard }})`.
    # Every step stays individually `if`-gated on `render`, exactly as before.
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not hide which OTHERS are also failing — with the
      # suite split four ways, a fail-fast cancel would report one red spec and
      # leave three quarters of the gate unrun.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: render-shard (${{ matrix.shard }}/6)
    # A wedged spec once held this job in_progress for 6h (the Actions default)
    # with logs unreadable until the kill. A shard's own ceiling is now ~21 min,
    # but the budget stays 120: it costs nothing when nothing hangs, and the one
    # thing it must still catch is a spec that wedges forever.
    timeout-minutes: 120
    steps:
      - if: needs.changes.outputs.render == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.render == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: needs.changes.outputs.render == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - if: needs.changes.outputs.render == 'true'
        run: bun install --frozen-lockfile
      - if: needs.changes.outputs.render == 'true'
        run: bun run build
      # Resolve the PINNED playwright-core version from the lockfile — the cache
      # key below, and nothing else, decides whether this job downloads Chromium.
      # It has to be the resolved version (bun.lock), not the `^1.59.1` range in
      # playground/package.json: the browser build is a function of the exact
      # playwright version (1.60.0 -> chromium revision 1223), and a range would
      # keep the key stable across a bump that changes the binaries.
      - if: needs.changes.outputs.render == 'true'
        id: pw-version
        run: |
          # `-m1` not `| head -1`: GitHub runs steps under `bash -eo pipefail`,
          # where head closing the pipe early SIGPIPEs grep into a 141 the step
          # then dies on. `|| true` keeps a no-match out of errexit so the guard
          # below is what reports it, with a message.
          version=$(grep -oEm1 '"playwright-core@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | tr -d '"' | cut -d@ -f2) || true
          test -n "$version" || { echo "::error::could not resolve playwright-core version from bun.lock"; exit 1; }
          echo "resolved playwright-core@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Cache the downloaded browser binaries (~/.cache/ms-playwright).
      #
      # KEYED ON THE PLAYWRIGHT VERSION, not the lockfile hash. The lockfile
      # version was a MISS on every run that touched any dependency, and a miss
      # that falls through to `restore-keys` still re-UPLOADS the whole cache in
      # the post step. Measured on run 32201891706: `Cache hit for restore-key:
      # pw-Linux-f232995...` — a prefix hit, not an exact one, on a job whose
      # sibling bun cache hit EXACTLY — so 259 MB came down and 259 MB went back
      # up, every run, into a scope no other PR can read (below). The browser
      # payload depends on the playwright version alone, so that is the key; a
      # dependency bump that leaves playwright alone is now a hit with no upload.
      #
      # No `restore-keys`: a prefix hit can only ever restore a DIFFERENT
      # revision's binaries, which `playwright install` must then re-download
      # anyway — it buys nothing and guarantees the re-upload described above.
      # The `ci-cache` workflow keeps this exact key warm on main, which is the
      # only scope a fresh PR branch can read from.
      #
      # SHARDING NOTE (#1863): this step now runs on EVERY shard, so on a WARM key
      # they all hit exactly and none of them saves — no race (that is the
      # `actions/cache` rule #1857 established). The one case that does race is a
      # playwright VERSION BUMP, where main is not yet warm and the shards each try to
      # reserve the new key: all but one lose and log `Failed to save`, costing a
      # handful of wasted uploads on exactly one PR and failing nothing. Bounded and once-per-bump,
      # so it is left alone rather than growing this change; the bun cache next door
      # needs no such caveat because #1859 already made it restore-only here.
      - if: needs.changes.outputs.render == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # Use the PROJECT-LOCAL playwright bin (hoisted to root node_modules
      # by bun), NOT `bunx playwright` — bunx fetches the standalone
      # `playwright` package at a DIFFERENT version, installs browsers for
      # that revision, and the test step (project @playwright/test) then
      # can't find its own revision's binary.
      #
      # `--only-shell`: this job runs HEADED=0, so playwright.config.ts sets
      # `headless: true` and no `channel` (XGIS_USE_SYSTEM_CHROME is unset in
      # CI). playwright-core's getExecutableName() resolves exactly that pair to
      # `chromium-headless-shell` — full Chromium is downloaded and then never
      # launched. Verified by installing ONLY the shell and launching this job's
      # own args (--enable-unsafe-webgpu --enable-unsafe-swiftshader
      # --use-angle=swiftshader --use-vulkan=swiftshader): the browser started,
      # `navigator.gpu` returned an adapter and WebGL2 came up on the SwiftShader
      # driver, with no chromium-1223 directory on disk. Measured payload:
      # 290.9 MiB -> 115.5 MiB downloaded, 641 MB -> 265 MB on disk. A HEADED
      # run still needs full Chromium, which is why this flag is on the CI
      # command and not in a config file.
      #
      # NO `--with-deps`. It ran an apt transaction, and sharding turned that from a
      # ~9 s cost into this job's dominant failure mode: six shards open an apt
      # transaction against the same regional mirror within four seconds of each
      # other, and most of them never finish. MEASURED on run 32236609546 — five of
      # the six burned the whole 8-minute backstop while shard 4 sailed through. The
      # CONTROL rules out the mirror: an UNSHARDED `render-gate` on another branch,
      # five minutes earlier in the same window (run 32236161072, job 96016531667),
      # installed in 54 s. The mirror was up; what changed was the concurrency.
      # Timeouts and retries only bound the damage — the log shows `Ign:` backing off
      # 1/2/4/8/16 s and even falling back to archive.ubuntu.com, then seven minutes
      # of silence — they do not make six simultaneous apt transactions succeed.
      #
      # `--with-deps` bought two things, and both are better served without it:
      #
      #   (a) SHARED LIBRARIES — now ASSERTED rather than assumed. `ldd` names every
      #       unresolved DT_NEEDED of the exact binary this job launches, so a runner
      #       image that drops one fails HERE with the library's name instead of as an
      #       opaque launch error, and apt runs only in that case. That is strictly
      #       more information than `--with-deps` gave us, at zero network cost.
      #
      #   (b) FONT PACKAGES (fonts-ipafont-gothic, fonts-freefont-ttf, fonts-unifont,
      #       fonts-wqy-zenhei, xfonts-*) — answered by the render gates themselves,
      #       which rasterise every glyph this repo draws and diff it. If one of those
      #       packages moved a gated pixel, the gates below go red and name the spec.
      #       That is the §5 bar: run the gates, do not reason about the fonts.
      - if: needs.changes.outputs.render == 'true'
        timeout-minutes: 8
        run: |
          pw=./playground/node_modules/.bin/playwright
          $pw install chromium --only-shell

          # ASK playwright where it put the browser; do not hardcode the path.
          # Both the directory and the executable inside it change between
          # revisions — rev 1194 was `chrome-linux/headless_shell`, rev 1223 ships
          # the Chrome-for-Testing `chrome-headless-shell-linux64/
          # chrome-headless-shell`. A hardcoded glob is a latent break, and it
          # already broke once here (b3ce44a, run 32238376734). `--dry-run` prints
          # the install location and downloads nothing.
          #
          # A here-string, not a pipe: awk exiting early would SIGPIPE its writer
          # into a 141 under `bash -eo pipefail`.
          plan=$($pw install chromium --only-shell --dry-run)
          root=$(awk '/Install location:/ { print $3; exit }' <<<"$plan")
          shell=$(find "$root" -maxdepth 2 -type f -perm -u+x -name '*headless*shell*' -print -quit 2>/dev/null)

          if [ -z "$shell" ]; then
            # Never fail the build on the DIAGNOSTIC's own bookkeeping. If a future
            # layout defeats the search, say so and let the gates below be the
            # judge — which is exactly the pre-existing behaviour, not a regression.
            echo "::warning::could not locate the headless shell under '$root' — skipping the linkage check; the render gates below still exercise the browser"
          else
            echo "headless shell: $shell"
            missing=$(ldd "$shell" | grep 'not found' || true)
            if [ -n "$missing" ]; then
              echo "::warning::$shell has unresolved libraries — falling back to apt:"
              echo "$missing"
              # apt has NO timeout on a stalled connection, so give it one BEFORE
              # using it. The policy goes in apt.conf.d because playwright spawns
              # apt itself and there is no flag to reach through `install-deps`. A
              # heredoc body and its terminator must sit at the block scalar's own
              # indentation, since that is column 0 of the script bash receives.
              sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'CONF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ftp::Timeout "30";
          Acquire::Retries "5";
          CONF
              $pw install-deps chromium
              still=$(ldd "$shell" | grep 'not found' || true)
